# fly.toml app configuration file generated for votika-backend on 2026-08-24T15:59:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'votika-backend'
primary_region = 'cdg'

[build]
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
